<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emma Avatar - VRM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0f; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
    }
    #ui-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .status-panel {
      background: rgba(10, 10, 15, 0.9);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }
    .status-panel h3 {
      color: #667eea;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .state-display {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-transform: capitalize;
    }
    .state-display.idle { color: #4ade80; }
    .state-display.listening { color: #60a5fa; }
    .state-display.thinking { color: #fbbf24; }
    .state-display.speaking { color: #f87171; }
    .audio-meter {
      width: 120px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 12px;
    }
    .audio-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 4px;
      transition: width 50ms linear;
      width: 0%;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.5);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(102, 126, 234, 0.4); }
    .btn.active { background: #667eea; }
    #connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 12px;
    }
    #connection-status.connected { color: #4ade80; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    #connection-status.connected .dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  
    .btn-settings {
      background: rgba(102, 126, 234, 0.3);
      border-color: rgba(102, 126, 234, 0.6);
    }
    .btn-settings:hover { background: rgba(102, 126, 234, 0.5); }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: #1a1a2e;
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    .modal-overlay.open .modal {
      transform: scale(1);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(102, 126, 234, 0.2);
    }
    .modal h2 { margin: 0; color: #667eea; }
    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .modal-close:hover { color: #fff; }
    
    .settings-section {
      margin-bottom: 20px;
    }
    .settings-section h3 {
      color: #667eea;
      font-size: 14px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .help-text {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }
    .help-text a { color: #60a5fa; }
    
    .input-group {
      display: flex;
      gap: 8px;
    }
    .api-key-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
    }
    .api-key-input:focus { outline: none; border-color: #667eea; }
    .toggle-btn {
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      color: #fff;
    }
    
    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .btn {
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.5);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(102, 126, 234, 0.4); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #667eea; border-color: #667eea; }
    .btn-success { background: #10b981; border-color: #10b981; }
    .btn-danger { background: #ef4444; border-color: #ef4444; }
    .btn-secondary { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    
    .status-message {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 12px;
    }
    .status-message.success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }
    .status-message.error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
    .status-message.info { background: rgba(96, 165, 250, 0.2); border: 1px solid #60a5fa; color: #60a5fa; }
    
    .settings-section label {
      display: block;
      margin: 8px 0;
      color: #ddd;
      font-size: 13px;
      cursor: pointer;
    }
    .settings-section select {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
    }
    
    .settings-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(102, 126, 234, 0.2);
      text-align: right;
    }
</style>
  <script type="module" crossorigin src="/assets/index-VHuZplsa.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="ui-overlay">
    <div class="status-panel">
      <h3>Estado del Avatar</h3>
      <div class="state-display idle" id="avatar-state">Idle</div>
      <div class="audio-meter">
        <div class="audio-meter-fill" id="audio-meter"></div>
      </div>
    </div>
    
    <div class="status-panel controls">
      <button class="btn" id="btn-idle" onclick="setState('idle')">Idle</button>
      <button class="btn" id="btn-listening" onclick="setState('listening')">Listening</button>
      <button class="btn" id="btn-thinking" onclick="setState('thinking')">Thinking</button>
      <button class="btn" id="btn-speaking" onclick="setState('speaking')">Speaking</button>
      <button class="btn" id="btn-lipsync" onclick="toggleLipSync()">Lip-sync: ON</button>
      <button class="btn btn-settings" id="btn-settings" onclick="openSettings()">⚙️</button>
    </div>
    
    <div id="connection-status">
      <span class="dot"></span>
      <span>WebSocket: Desconectado</span>
    </div>
  </div>


  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ Configuración</h2>
        <button class="modal-close" onclick="closeSettings()">&times;</button>
      </div>
      
      <div class="settings-section">
        <h3>🔑 OpenRouter API Key</h3>
        <p class="help-text">
          Necesaria para el modelo LLM (Gemma-4-12b). 
          <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">Obtener clave</a>
        </p>
        <div class="input-group">
          <input type="password" id="api-key-input" placeholder="sk-or-xxxxxxxxxxxx" class="api-key-input">
          <button class="toggle-btn" onclick="toggleKeyVisibility()" aria-label="Mostrar/Ocultar">👁</button>
        </div>
        <div class="button-row">
          <button class="btn btn-primary" onclick="testApiKey()" id="btn-test">🧪 Probar Conexión</button>
          <button class="btn btn-success" onclick="saveApiKey()">💾 Guardar</button>
          <button class="btn btn-danger" onclick="clearApiKey()">🗑️ Borrar</button>
        </div>
        <div id="api-status"></div>
      </div>
      
      <div class="settings-section">
        <h3>🎤 Audio</h3>
        <label><input type="checkbox" id="half-duplex" checked> Half-duplex (micrófono off mientras habla Emma)</label>
        <label><input type="checkbox" id="post-tts-delay" checked> Post-TTS delay (500ms)</label>
      </div>
      
      <div class="settings-section">
        <h3>🤖 Modelo LLM</h3>
        <select id="model-select">
          <option value="google/gemma-4-12b">Gemma 4 12B (Recomendado, gratis)</option>
          <option value="google/gemma-4-26b-a4b-it">Gemma 4 26B MoE</option>
          <option value="openrouter/auto">Auto (OpenRouter decide)</option>
        </select>
      </div>
      
      <div class="settings-footer">
        <button class="btn btn-secondary" onclick="closeSettings()">Cerrar</button>
      </div>
    </div>
  </div>
</body>
</html>
