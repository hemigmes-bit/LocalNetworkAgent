<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emma Avatar - VRM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0f; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas { 
      display: block; 
      width: 100vw; 
      height: 100vh; 
    }
    #ui-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .status-panel {
      background: rgba(10, 10, 15, 0.9);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }
    .status-panel h3 {
      color: #667eea;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .state-display {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-transform: capitalize;
    }
    .state-display.idle { color: #4ade80; }
    .state-display.listening { color: #60a5fa; }
    .state-display.thinking { color: #fbbf24; }
    .state-display.speaking { color: #f87171; }
    .audio-meter {
      width: 120px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 12px;
    }
    .audio-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 4px;
      transition: width 50ms linear;
      width: 0%;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.5);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(102, 126, 234, 0.4); }
    .btn.active { background: #667eea; }
    #connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 12px;
    }
    #connection-status.connected { color: #4ade80; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    #connection-status.connected .dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  </style>
  <script type="module" crossorigin src="/assets/index-wJizf2xg.js"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="ui-overlay">
    <div class="status-panel">
      <h3>Estado del Avatar</h3>
      <div class="state-display idle" id="avatar-state">Idle</div>
      <div class="audio-meter">
        <div class="audio-meter-fill" id="audio-meter"></div>
      </div>
    </div>
    
    <div class="status-panel controls">
      <button class="btn" id="btn-idle" onclick="setState('idle')">Idle</button>
      <button class="btn" id="btn-listening" onclick="setState('listening')">Listening</button>
      <button class="btn" id="btn-thinking" onclick="setState('thinking')">Thinking</button>
      <button class="btn" id="btn-speaking" onclick="setState('speaking')">Speaking</button>
      <button class="btn" id="btn-lipsync" onclick="toggleLipSync()">Lip-sync: ON</button>
    </div>
    
    <div id="connection-status">
      <span class="dot"></span>
      <span>WebSocket: Desconectado</span>
    </div>
  </div>

</body>
</html>
