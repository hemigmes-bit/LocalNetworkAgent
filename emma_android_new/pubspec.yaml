name: emma_android
description: Emma - English Tutor & Device Manager for Android
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # UI & Navigation
  go_router: ^14.0.0
  provider: ^6.1.2
  
  # UI Components
  flutter_animate: ^4.5.0
  flutter_markdown: ^0.7.0
  cached_network_image: ^3.3.1
  
  # Python Integration (Chaquopy)
  chaquopy: ^0.0.20
  
  # Android Native
  permission_handler: ^11.3.0
  audio_session: ^0.1.20
  
  # Audio/Voice
  record: ^5.0.4
  just_audio: ^0.9.36
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  
  # Storage & Network
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.5.0
  
  # Local Notifications
  flutter_local_notifications: ^17.1.2
  
  # Utils
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/python/