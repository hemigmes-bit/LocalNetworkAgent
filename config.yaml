llm:
  models:
  - qwen/qwen-2.5-7b-instruct:free
  - meta-llama/llama-3.1-8b-instruct:free
  - google/gemma-2-9b-it:free
  - microsoft/phi-3-mini-128k-instruct:free
  - huggingfaceh4/zephyr-7b-beta:free
  - nousresearch/hermes-3-llama-3.1-8b:free
  ollama_url: http://localhost:11434
  ollama_model: qwen2.5-coder:7b
  temperature: 0.7
  max_tokens: 500
history:
  max_turns: 10
stt:
  model_size: medium
  device: cuda
  compute_type: float16
  language: null
  beam_size: 1
  vad_filter: true
  min_silence_ms: 500
vad:
  threshold: 0.5
  min_silence_duration_ms: 800
  min_speech_duration_ms: 250
  speech_pad_ms: 100
  end_of_turn_silence_ms: 800
  min_speech_ms: 400
tts:
  model_path: kokoro-v1.0.onnx
  voices_path: voices-v1.0.bin
  sample_rate: 24000
  voices:
    es: ef_dora
    en: af_bella
    es_male: em_alex
    en_male: am_michael
audio:
  sample_rate: 16000
  channels: 1
  block_size: 512
  input_device: 1
  half_duplex: true
  post_tts_delay_ms: 500
logging:
  latency_csv: logs/latency.csv
  level: INFO
system_prompt: "Eres Emma, tutora bilingüe de inglés/español amable y paciente.\n\n\
  REGLAS:\n1. Responde con frases CORTAS (máx 2-3 oraciones).\n2. Puedes hablar español\
  \ si el usuario lo necesita.\n3. Corrige errores de forma natural y breve.\n4. Introduce\
  \ 1-2 palabras nuevas relevantes por turno.\n5. Mantén un tono conversacional y\
  \ alentador.\n\nFORMATO DE RESPUESTA (JSON obligatorio):\n{\n  \"spoken\": \"Frase\
  \ natural que dices en voz alta\",\n  \"language\": \"en|es\",\n  \"corrections\"\
  : [\n    {\"original\": \"error\", \"corrected\": \"corrección\", \"type\": \"grammar|vocabulary|pronunciation\"\
  , \"explanation\": \"breve\"}\n  ],\n  \"vocabulary\": [\n    {\"word\": \"palabra\"\
  , \"translation\": \"traducción\", \"example\": \"ejemplo\"}\n  ]\n}"
